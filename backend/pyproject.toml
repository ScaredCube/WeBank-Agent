[project]
name = "bank-agent-backend"
version = "0.1.0"
description = "Bank AI Agent backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.7.0",
    "openai>=1.61.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "sse-starlette>=2.2.0",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
